  color-scheme: dark;

* { box-sizing: border-box; }
body {

.cabecalho { padding-block: 2.5rem 1.5rem; border-bottom: 3px double var(--tinta); display: flex; flex-direction: column; gap: .6rem; }

.inicio { display: flex; flex-direction: column; gap: .9rem; }
.topicos { display: grid; grid-template-columns: repeat(auto-fill, minmax(14rem, 1fr)); gap: .6rem; }
.topicos a { display: flex; gap: .6rem; align-items: baseline; padding: .85rem 1rem; border: 1px solid var(--linha); border-radius: var(--raio); background: var(--folha); text-decoration: none; color: var(--tinta); font-family: var(--f-titulo); font-weight: 600; font-size: 1rem; line-height: 1.25; min-width: 0; }
.topicos a .par { font-family: var(--f-dado); color: var(--acento); font-weight: 400; font-size: .85rem; white-space: nowrap; }

.topicos a[aria-current="page"] { background: var(--acento-suave); border-color: var(--acento); }

.secao-topo .par { font-family: var(--f-dado); color: var(--acento); font-size: .95rem; white-space: nowrap; }

.intro { color: var(--tinta-2); }
h3 { font-size: 1.12rem; font-weight: 700; font-stretch: 92%; }

/* Destaques */
.destaques { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: .9rem; counter-reset: d; }
.destaques li { display: grid; grid-template-columns: 2rem 1fr; gap: .5rem; }

.grafico .legenda { display: flex; flex-wrap: wrap; gap: .3rem 1rem; font-size: .85rem; color: var(--tinta-2); }

.nota { font-size: .82rem; color: var(--tinta-2); }

/* Tabelas */
.tabela { overflow-x: auto; border: 1px solid var(--linha); border-radius: var(--raio); background: var(--folha); }
table { border-collapse: collapse; width: 100%; font-size: .92rem; }
th, td { text-align: left; padding: .55rem .7rem; border-bottom: 1px solid var(--linha); vertical-align: top; }
th { font-family: var(--f-titulo); font-size: .74rem; letter-spacing: .06em; text-transform: uppercase; color: var(--tinta-2); font-weight: 600; white-space: nowrap; }
tr:last-child td { border-bottom: 0; }
.comparacao td.var { color: var(--tinta-2); }

a=&altura=&tipoForm=diarios&selCodColecaoCsv=D&Datain=15%2F10%2F2026&txPagina=&txSuplemento=&enviar=Pesquisar"], ["2026-10-14T19:32", "PELA ORDEM", "Ordem do Dia", "O Deputado celebrou a aprovação do perdão da dívida dos microempreendedores individuais (MEIs), atribuindo a conquista ao Presidente Lula, ao Presidente da Câmara, Hugo Motta, e ao Relator, Deputado Rubens Pereira Júnior. Recordou que o Governo Lula foi o responsável pela criação do MEI e pela atualização da tabela de enquadramento após oito anos sem revisão. Além disso, anunciou o voto favorável…", "https://imagem.camara.gov.br/dc_20b.asp?largura=&altura=&tipoForm=diarios&selCodColecaoCsv=D&Datain=15%2F10%2F2026&txPagina=&txSuplemento=&enviar=Pesquisar"], ["2026-10-14T18:32", "COMO LÍDER", "Ordem do Dia", "O Deputado comemorou os resultados de pesquisa eleitoral que, segundo afirmou, indicaram empate entre Lula e Flávio Bolsonaro, e atribuiu o desempenho às mobilizações populares. Defendeu o Projeto de Lei Complementar nº 186, de 2026, que altera a Lei Complementar nº 123, de 2006, para dispor sobre o limite de receita bruta anual e o número de empregados do Microempreendedor Individual (MEI); prop…", "https://imagem.camara.gov.br/dc_20b.asp?largura=&altura=&tipoForm=diarios&selCodColecaoCsv=D&Datain=15%2F10%2F2026&txPagina=&txSuplemento=&enviar=Pesquisar"], ["2026-10-14T17:16", "PELA ORDEM", "Ordem do Dia", "O Deputado orientou o Governo a votar contrariamente ao requerimento de retirada de pauta do Projeto de Lei Complementar nº 186, de 2026, que altera a Lei Complementar nº 123, de 14 de dezembro de 2006, para dispor sobre o limite de receita bruta anual e o número de empregados do Microempreendedor Individual. Além disso, ressaltou que o Governo apoia o projeto, o qual foi enviado pelo Presidente …", "https://imagem.camara.gov.br/dc_20b.asp?largura=&altura=&tipoForm=diarios&selCodColecaoCsv=D&Datain=15%2F10%2F2026&txPagina=&txSuplemento=&enviar=Pesquisar"], ["2026-10-13T17:12", "PELA ORDEM", "Breves 7520.98, "6338": 395388.3, "6369": 395058.86, "4994": 393358.43, "5012": 391995.77, "5998": 391965.31, "1173": 391883.64, "6340": 377178.56, "6358": 374836.62, "5411": 373814.73, "5793": 370890.65, "581": 369547.32, "3806": 367237, "5422": 367126.46, "5967": 366758.46, "5936": 362928.86, "285": 361111.95, "5990": 358424.68, "742": 346966.35, "5906": 345792.16, "4770": 343534.64, "6335": 338129.68, "631": 329853.33, "6009": 317281.06, "5953": 306471.18, "4694": 296411.11, "739": 293552.11, "1186": 292388.89, "5783": 282433.59, "6010": 279913.18, "22": 279497.29, "6025": 277235.81, "5736": 274775.57, "5973": 264304.33, "475": 261413.76, "6295": 259838.45, "4560": 247229.01, "6342": 245896.92, "5376": 244252.04, "470": 240597.77, "5672": 240512.16, "3830": 232000, "5502": 227902.54, "5523": 223571.91, "345": 205735.28, "3777": 199557.84, "4642": 198330.69, "5386": 190314.11, "5207": 182289.53, "5748": 161224.42, "70": 151815.08, "5322": 150251.55, "35": 149629.17, "5070": 132214.26, "5899": 120276.27, "6336": 96535.39, "5894": 86264.27, "5924": 57082.52, "6337": 47814.11, "5974": 12563.56}, "ano_ceaps": 2026}}, "comparacao": {"semana_anterior": {"inicio": "2026-10-05", "fim": "2026-10-11"}, "atual": {"camara_votacoes": 23, "camara_nominais": 3, "camara_proposicoes": 439, "senado_nominais": 3}, "anterior": {"camara_votacoes": 0, "camara_nominais": 0, "camara_proposicoes": 112, "senado_nominais": 0}}}, "conteudo": {"destaques": [{"texto": "O Senado aprovou em 14/10, por 75 a 1 nos dois turnos, a PEC do fim da escala 6x1. O Congresso a promulgou em 16/10 como Emenda Constitucional 141: a jornada máxima cai de 44 para 42 horas em 60 dias e para 40 horas 14 meses após a publicação, sem redução de salário.", "link": "congresso"}, {"texto": "A Câmara aprovou em 14/10, por 461 a 4, o projeto que eleva o teto do MEI de R$ 81 mil para R$ 110 mil em 2027 e R$ 140 mil em 2028 e perdoa dívidas do MEI com a União. O Senado aprovou o texto no dia seguinte, por 78 a 0.", "link": "como-votou"}, {"texto": "Na Câmara, uma mudança no projeto que cria regras para bancos em crise (PLP 281/2019) teve 252 votos a favor e 176 contra, mas foi rejeitada: lei complementar exige 257 votos, a maioria absoluta dos 513 deputados.", "link": "congresso"}, {"texto": "O governo federal assinou em 13/10 o compromisso de repassar R$ 3 bilhões para a ponte Salvador-Itaparica.", "link": "bahia"}, {"texto": "A meta da Selic segue em 13,75% ao ano. O dólar subiu de R$ 4,99 para R$ 5,08 entre 9/10 e 16/10.", "link": "economia"}], "economia": {"intro": "Semana sem reunião do Copom e sem divulgação de inflação oficial. Os números abaixo são os mais recentes publicados pelo Banco Central na data desta edição.", "analise": "A meta da Selic está em 13,75% ao ano desde 17/09/2026, depois de quatro cortes seguidos de 0,25 ponto em 2026 (Banco Central, série 432). O IPCA acumulado em 12 meses até setembro foi de 4,58% (série 13522). A diferença entre os dois dá um juro real perto de 9% ao ano, alto para os padrões do Brasil.\n\nNa semana, o dólar comercial subiu de R$ 4,9892 (9/10) para R$ 5,0826 (16/10), segundo a série 1 do Banco Central. Nas projeções do mercado (boletim Focus de 16/10), a Selic termina 2026 em 13,25% e o IPCA do ano fica em 5,22%.\n\nO projeto do MEI aprovado na semana tem efeito fiscal: segundo a equipe econômica, citada pelo Diário do Grande ABC, o perdão de dívidas custa R$ 3 bilhões em três anos.", "fatos": []}, "leis": [{"titulo": "Emenda Constitucional 141: fim da escala 6x1", "status": "promulgada", "data": "2026-10-16", "casa": "Congresso Nacional", "texto": "Originada da PEC 221/2019, a emenda substitui a escala de seis dias de trabalho e um de folga pela de cinco dias e dois de folga, sem redução de salário. Foi promulgada em sessão solene em 16/10, com a presença do presidente Lula, segundo a Agência Senado. Na mesma sessão foi promulgada a Emenda Constitucional 140, com regras especiais de aposentadoria para agentes comunitários de saúde e de combate às endemias.", "o_que_muda": "A Constituição (art. 7º, XIII, no acervo) passou a dizer: \"duração do trabalho normal não superior a 8 (oito) horas diárias e 40 (quarenta) horas semanais\". Antes, o limite era de 44 horas. A transição: 60 dias após a publicação, a jornada máxima cai para 42 horas e o trabalhador passa a ter dois dias de descanso semanal remunerado; 14 meses após a publicação, o limite chega a 40 horas. Um dos dias de folga deve ser, de preferência, no domingo.", "lados": {"a": "O presidente do Congresso, Davi Alcolumbre, falou em \"direito ao tempo para viver\"; Lula disse que \"ninguém quer que empresa quebre, mas também ninguém quer que o trabalhador morra por falta de descanso\".", "b": "O senador Hamilton Mourão (Republicanos-RS) foi o único voto contrário no Senado. Na Câmara, o deputado Kim Kataguiri (Missão-SP), que também votou contra, disse não ser contra o fim da 6x1, mas chamou a PEC de \"farsante\" e afirmou que ela pode causar inflação e informalidade.", "rotulo_a": "Quem defende diz", "rotulo_b": "Quem critica diz"}, "fontes": [{"nome": "Agência Senado", "url": "https://www12.senado.leg.br/noticias/materias/2026/10/16/congresso-promulga-o-fim-da-escala-6x1-e-aposentadoria-de-agentes-de-saude"}, {"nome": "Folha Vitória/Estadão", "url": "https://www.folhavitoria.com.br/politica/senado-aprova-o-fim-da-escala-6x1/"}, {"nome": "Itatiaia (Kim Kataguiri)", "url": "https://www.itatiaia.com.br/politica/kim-kataguiri-que-votou-contra-o-fim-da-escala-6x1-diz-nao-temer-perder-votos-pec-farsante/"}, {"nome": "Texto da EC 141 (Planalto)", "url": "https://www.planalto.gov.br/ccivil_03/constituicao/emendas/emc/emc141.htm"}]}], "congresso": {"intro": "Semana de esforço concentrado antes do segundo turno: o Senado votou a PEC da escala 6x1 e o projeto do MEI, e a Câmara votou o MEI e o regime para bancos em crise.", "itens": [{"titulo": "PLP 186/2026: novo teto do MEI e perdão de dívidas, aprovado nas duas Casas", "status": "aprovada", "data": "2026-10-14", "casa": "Câmara (14/10) e Senado (15/10)", "texto": "A Câmara aprovou o texto por 461 a 4 em 14/10, com relatoria de Rubens Pereira Júnior (PT-MA), e o Senado por 78 a 0 em 15/10. O projeto eleva o limite de faturamento do MEI de R$ 81 mil por ano para R$ 110 mil em 2027 e R$ 140 mil a partir de 2028, permite contratar até dois empregados (hoje, um) e perdoa as dívidas das contribuições do MEI inscritas na Dívida Ativa da União até 13/10/2026. Para ter o perdão, o MEI precisa manter as contribuições em dia por seis meses depois de a lei entrar em vigor, em 1º/01/2027, e desistir de ações judiciais sobre essas dívidas.", "o_que_muda": "Hoje a Lei Complementar 123/2006 (art. 18-A, §1º, no acervo) define o MEI como quem teve receita bruta de até R$ 81.000,00 no ano anterior. O texto aprovado muda esse valor.", "fontes": [{"nome": "Diário do Grande ABC/Estadão", "url": "https://www.dgabc.com.br/Noticia/4352780/por-461-a-4-camara-aprova-plp-que-amplia-teto-do-mei-e-perdoa-dividas-do-setor"}, {"nome": "Câmara: PLP 186/2026", "url": "https://www.camara.leg.br/propostas-legislativas/2635476"}, {"nome": "LC 123/2006", "url": "https://normas.leg.br/?urn=urn:lex:br:federal:lei.complementar:2006-12-14;123"}]}, {"titulo": "PLP 281/2019: mudança no regime para bancos em crise não alcança os 257 votos", "status": "rejeitada", "data": "2026-10-14", "casa": "Câmara", "texto": "O projeto cria novas regras para recuperar ou fechar bancos em dificuldade: acionistas e alguns credores assumem os prejuízos antes de qualquer socorro com dinheiro público, mas a União poderia fazer empréstimos e aportes temporários em crises excepcionais. Esse último ponto encontrou resistência do governo, segundo o Congresso em Foco. Em 14/10, a subemenda substitutiva da Comissão de Finanças e Tributação teve 252 votos a favor e 176 contra e foi rejeitada, porque não chegou à maioria absoluta. Não encontrei o desfecho do projeto depois dessa votação.", "o_que_muda": "Por ser lei complementar, o projeto precisa de maioria absoluta: \"As leis complementares serão aprovadas por maioria absoluta\" (Constituição, art. 69). Na Câmara, isso é 257 dos 513 deputados, qualquer que seja o número de presentes.", "fontes": [{"nome": "Congresso em Foco", "url": "https://www.congressoemfoco.com.br/noticia/123233/camara-pode-votar-nesta-quarta-novo-regime-para-bancos-em-crise"}, {"nome": "Câmara: PLP 281/2019", "url": "https://www.camara.leg.br/propostas-legislativas/2236186"}]}]}, "deputados": [{"nome": "Sandro Filho", "partido": "PP", "uf": "BA", "cargo": "Deputado federal eleito (posse em 1º/02/2027) · vereador de Salvador", "status": "Eleito", "chave_ceap": "", "fatos": [{"tipo": "registro", "texto": "Eleito em 04/10/2026 com 167.394 votos, sexto mais votado da Bahia, aos 21 anos: o deputado federal mais jovem da história do estado. Fato anterior à semana.", "fontes": [{"nome": "Correio", "url": "https://www.correio24horas.com.br/bahia/aos-21-anos-vereador-de-salvador-tem-167-mil-votos-e-vira-o-deputado-federal-mais-jovem-da-historia-da-bahia-1026"}]}], "sem_novidades": "Não encontrei fato novo de 12 a 18/10."}, {"nome": "Paulo Câmara", "partido": "PL", "uf": "BA", "cargo": "Deputado estadual da Bahia, reeleito em 2026", "status": "Reeleito", "chave_ceap": "", "fatos": [{"tipo": "registro", "texto": "Reeleito para o 3º mandato na Assembleia Legislativa da Bahia com 65.682 votos. Disse não esperar a vantagem de Jerônimo Rodrigues (PT) na eleição para governador. Fato anterior à semana.", "fontes": [{"nome": "A Tarde", "url": "https://atarde.com.br/eleicoes/obrigado-minha-bahia-paulo-camara-celebra-reeleicao-para-3-mandato-1404686"}, {"nome": "Muita Informação", "url": "https://muitainformacao.com.br/eleicoes/paulo-camara-celebra-reeleicao-admite-surpresa-com-vantagem-de-jeronimo-e-prega-reinvencao-do-grupo-apos-derrota-de-acm-neto/"}]}], "sem_novidades": "Não encontrei atuação de Paulo Câmara datada de 12 a 18/10."}], "em_evidencia": {"criterio": "Nesta edição de teste, entram os deputados com papel nas votações nominais da semana, segundo os dados da Câmara e reportagens. A busca por notícias de 12 a 18/10 não trouxe casos de deputados com repercussão em veículos de linhas diferentes.", "deputados": [{"titulo": "Kim Kataguiri (Missão-SP): um dos 4 votos contra o projeto do MEI", "data": "2026-10-14", "casa": "Câmara", "texto": "Votou Não no texto do MEI, aprovado por 461 a 4. Os outros votos contrários foram de Sargento Portugal (Podemos-RJ), Antonio Andrade (PSDB-TO) e Aécio Neves (PSDB-MG). Não encontrei justificativa pública de nenhum deles para esse voto.", "fontes": [{"nome": "Câmara, dados abertos (votação 2635476-36)", "url": "https://dadosabertos.camara.leg.br/api/v2/votacoes/2635476-36/votos"}]}, {"titulo": "Rubens Pereira Júnior (PT-MA): relator do projeto do MEI", "data": "2026-10-14", "casa": "Câmara", "texto": "Manteve a proposta do Executivo e incluiu o perdão das dívidas, que vinha de outro projeto anunciado por Lula em 13/10.", "fontes": [{"nome": "Diário do Grande ABC/Estadão", "url": "https://www.dgabc.com.br/Noticia/4352780/por-461-a-4-camara-aprova-plp-que-amplia-teto-do-mei-e-perdoa-dividas-do-setor"}]}, {"titulo": "Hugo Motta (Republicanos-PB): presidente da Câmara pôs o regime bancário como primeiro item da pauta", "data": "2026-10-14", "casa": "Câmara", "texto": "O projeto já tinha saído da pauta quatro vezes no primeiro trimestre por resistência do governo, segundo o Congresso em Foco. Como presidente da Casa, Motta não vota nas votações comuns. Nos dados da Câmara isso aparece como \"Artigo 17\", a regra do Regimento Interno.", "fontes": [{"nome": "Congresso em Foco", "url": "https://www.congressoemfoco.com.br/noticia/123233/camara-pode-votar-nesta-quarta-novo-regime-para-bancos-em-crise"}]}]}, "presidente": {"intro": "Lula participou da promulgação do fim da escala 6x1 e anunciou o perdão de dívidas do MEI. Não encontrei leis sancionadas, vetos novos nem medidas provisórias com data de 12 a 18/10.", "agenda": [{"titulo": "Anúncio do perdão de dívidas do MEI", "data": "2026-10-13", "texto": "Lula anunciou uma proposta de perdão de dívidas dos MEIs. Ela foi juntada ao projeto do novo teto, aprovado no dia seguinte pela Câmara.", "fontes": [{"nome": "Diário do Grande ABC/Estadão", "url": "https://www.dgabc.com.br/Noticia/4352780/por-461-a-4-camara-aprova-plp-que-amplia-teto-do-mei-e-perdoa-dividas-do-setor"}]}, {"titulo": "Presença na promulgação da Emenda Constitucional 141", "data": "2026-10-16", "texto": "Na sessão solene do Congresso, Lula disse: \"A Constituição ficou mais cidadã\".", "fontes": [{"nome": "Agência Senado", "url": "https://www12.senado.leg.br/noticias/materias/2026/10/16/congresso-promulga-o-fim-da-escala-6x1-e-aposentadoria-de-agentes-de-saude"}]}]}, "justica": [{"titulo": "STF: resultados da sessão virtual de 9 a 19/10 ainda não divulgados", "casa": "STF", "texto": "Segundo o boletim do STF, os julgamentos da sessão virtual de 9 a 19/10 serão divulgados quando forem publicados por inteiro. A sessão seguinte, de 16 a 23/10, tem na pauta a contribuição sindical de micro e pequenas indústrias artesanais (Tema 488). Não encontrei decisão de efeito geral do STF com data de 12 a 18/10.", "fontes": [{"nome": "STF, Pauta Virtual em Evidência 32/2026", "url": "https://www.stf.jus.br/arquivo/cms/codi/anexo/PV_EM_EVIDENCIA/2026/PVE32_2026_Partes1e2.pdf"}]}], "bahia": [{"titulo": "Governo federal assina compromisso de R$ 3 bilhões para a ponte Salvador-Itaparica", "data": "2026-10-13", "texto": "Participaram o governador Jerônimo Rodrigues (PT), a ministra da Casa Civil, Miriam Belchior, e o ministro dos Transportes, George Santoro. O anúncio foi feito pelo senador Otto Alencar (PSD).", "fontes": [{"nome": "Bahia Notícias", "url": "https://www.bahianoticias.com.br/noticia/322388-governo-lula-formaliza-compromisso-de-rdollar-3-bilhoes-para-ponte-salvador-itaparica"}]}], "agenda": [{"data": "2026-10-25", "evento": "Segundo turno das eleições para presidente e governadores, das 8h às 17h (horário de Brasília)", "onde": "Todo o país"}, {"data": "2026-10-23", "evento": "Fim da sessão virtual do STF iniciada em 16/10 (Tema 488, contribuição sindical)", "onde": "STF"}], "tema_da_semana": {"titulo": "por que 252 votos não bastaram", "texto": "Cada tipo de norma exige um número diferente de votos no Congresso. Uma lei ordinária passa por maioria simples: mais da metade dos presentes, desde que esteja presente a maioria dos membros (Constituição, art. 47). Já a lei complementar precisa de maioria absoluta: \"As leis complementares serão aprovadas por maioria absoluta\" (Constituição, art. 69). Na Câmara, isso é 257 dos 513 deputados, quantos estejam presentes.\n\nFoi o que aconteceu em 14/10 com o projeto do regime para bancos em crise (PLP 281/2019). A mudança proposta teve 252 votos a favor e 176 contra, mas ficou 5 votos abaixo dos 257 e foi rejeitada. O projeto do MEI, também lei complementar, passou com folga: 461 votos.\n\nUma emenda à Constituição exige ainda mais: três quintos dos membros de cada Casa, em dois turnos (Constituição, art. 60, §2º). No Senado, isso dá 49 dos 81 senadores. A PEC da escala 6x1 teve 75 votos nos dois turnos.", "fontes": [{"nome": "Constituição Federal (texto compilado)", "url": "https://www.planalto.gov.br/ccivil_03/constituicao/constituicaocompilado.htm"}]}, "avisos": ["Edição de teste montada em 27/10/2026, a pedido do leitor, para mostrar a consulta de votos. Cobre a semana de 12 a 18/10/2026.", "Não encontrei decisões do STF nem atos do Presidente (sanções, vetos, medidas provisórias) com data da semana. Isso pode refletir falha da busca, e não ausência de atos; o Diário Oficial não foi consultado."]}}</script>
<script>
(function () {

  /* ---------- utilitários ---------- */

    if (attrs) for (var k in attrs) {

      else if (k === "html") n.innerHTML = attrs[k];

      else if (k === "style") n.setAttribute("style", attrs[k]);
      else n.setAttribute(k, attrs[k]);
    }
    (filhos || []).forEach(function (f) { if (f != null) n.appendChild(typeof f === "string" ? document.createTextNode(f) : f); });
    return n;
  }
  function svgEl(tag, attrs) {
    var n = document.createElementNS("http://www.w3.org/2000/svg", tag);
    for (var k in attrs) n.setAttribute(k, attrs[k]);
    return n;
  }
  var nf = function (v, casas) { return v == null || isNaN(v) ? "—" : Number(v).toLocaleString("pt-BR", { minimumFractionDigits: casas, maximumFractionDigits: casas }); };
  var brl = function (v) { return v == null ? "—" : Number(v).toLocaleString("pt-BR", { style: "currency", currency: "BRL", maximumFractionDigits: 0 }); };
  function dataBR(iso, opts) {

    var d = new Date(iso.length <= 10 ? iso + "T12:00:00" : iso);
    return d.toLocaleDateString("pt-BR", opts || { day: "2-digit", month: "2-digit", year: "numeric" });
  }
  function mesBR(iso) { return dataBR(iso, { month: "short", year: "2-digit" }).replace(". de ", "/").replace(" de ", "/"); }
  function cor(nome) { return getComputedStyle(document.documentElement).getPropertyValue(nome).trim(); }
  function fontes(lista) {
    if (!lista || !lista.length) return null;
    return el("div", { class: "fontes" }, ["Fontes: "].concat(lista.map(function (f) {
      return f.url ? el("a", { href: f.url, target: "_blank", rel: "noopener" }, [f.nome || f.url]) : el("span", { text: f.nome + " " });
    })));
  }
  function paragrafos(texto) {
    if (!texto) return [];
    return String(texto).split(/\n\s*\n/).map(function (t) { return el("p", { text: t.trim() }); });
  }
  var SELOS = { entrega: ["bom", "Entrega"], atencao: ["atencao", "Ponto de atenção"], registro: ["neutro", "Registro"], aprovada: ["bom", "Aprovada"], sancionada: ["bom", "Sancionada"], promulgada: ["bom", "Promulgada"], rejeitada: ["atencao", "Rejeitada"], vetada: ["atencao", "Vetada"], "veto parcial": ["ocre", "Veto parcial"], "em tramitação": ["neutro", "Em tramitação"], editada: ["ocre", "Editada"], "perde validade": ["atencao", "Perde validade"] };
  function selo(tipo, textoLivre) {
    var s = SELOS[(tipo || "").toLowerCase()] || ["neutro", textoLivre || tipo || ""];
    return el("span", { class: "selo " + s[0], text: textoLivre || s[1] });
  }

  var secoes = [];
  function secao(id, titulo, intro) {
    var n = secoes.length + 1;
    var s = el("section", { id: id }, [
      el("div", { class: "secao-topo" }, [el("span", { class: "par", text: "§ " + n }), el("h2", { text: titulo })])
    ]);
    if (intro) s.appendChild(el("p", { class: "intro", text: intro }));
    secoes.push([id, titulo]);
    document.getElementById("conteudo").appendChild(s);
    return s;
  }

  /* ---------- gráficos SVG ---------- */
  function ultimo(serie) { return serie && serie.pontos && serie.pontos.length ? serie.pontos[serie.pontos.length - 1] : null; }
  function valorEm(serie, diasAtras) {
    if (!serie || !serie.pontos.length) return null;
    var fim = new Date(ultimo(serie)[0]); fim.setDate(fim.getDate() - diasAtras);
    var alvo = fim.toISOString().slice(0, 10), achado = null;
    serie.pontos.forEach(function (p) { if (p[0] <= alvo) achado = p; });
    return achado;
  }
  function sparkline(pontos, corVar) {
    var w = 200, h = 34, s = svgEl("svg", { viewBox: "0 0 " + w + " " + h, preserveAspectRatio: "none", "aria-hidden": "true" });
    if (!pontos || pontos.length < 2) return s;
    var ys = pontos.map(function (p) { return p[1]; }), min = Math.min.apply(null, ys), max = Math.max.apply(null, ys), r = (max - min) || 1;
    var pts = pontos.map(function (p, i) { return [i / (pontos.length - 1) * (w - 4) + 2, h - 3 - (p[1] - min) / r * (h - 6)]; });
    var d = pts.map(function (p, i) { return (i ? "L" : "M") + p[0].toFixed(1) + " " + p[1].toFixed(1); }).join(" ");
    s.appendChild(svgEl("path", { d: d + " L" + pts[pts.length - 1][0] + " " + h + " L" + pts[0][0] + " " + h + " Z", fill: cor(corVar), "fill-opacity": ".12", stroke: "none" }));
    s.appendChild(svgEl("path", { d: d, fill: "none", stroke: cor(corVar), "stroke-width": "1.6", "vector-effect": "non-scaling-stroke" }));
    var u = pts[pts.length - 1];
    s.appendChild(svgEl("circle", { cx: u[0], cy: u[1], r: 2.5, fill: cor(corVar) }));
    return s;
  }
  // Gráfico de linhas com eixo de tempo; series = [{nome, pontos, corVar}]
  function grafico(titulo, series, opts) {

      tbr.appendChild(el("tr", null, [el("td", { class: "n", text: i + 1 }), el("td", { text: r.nome + " (" + r.partido + "-" + r.uf + ")" }), el("td", { class: "n", text: brl(r.total) }), el("td", { class: "n", text: nf(r.total / ceap.media, 1) + "×" })]));
    });
    tr.appendChild(tbr);
    s5.appendChild(el("h3", { text: "Maiores gastos da cota parlamentar em " + ceap.mes }));
    s5.appendChild(el("div", { class: "tabela" }, [tr]));
    s5.appendChild(el("p", { class: "nota" }, ["Média entre os " + ceap.deputados_com_gasto + " deputados com gastos no mês: " + brl(ceap.media) + ". Gasto alto não é irregularidade: a cota varia por estado, e notas atrasadas mudam o total. Fonte: ", el("a", { href: ceap.fonte, target: "_blank", rel: "noopener", text: "Câmara, arquivo da cota parlamentar" }), "."]));
  }

  /* §6 Presidente e governo federal */
  var P = C.presidente || {}, vetos = (K.senado || {}).vetos;
  var gruposPres = [["sancoes", "Leis sancionadas"], ["vetos", "Vetos da semana"], ["mps", "Medidas provisórias"], ["decretos", "Decretos e outros atos"], ["agenda", "Agenda e anúncios"]];
  var temPres = gruposPres.some(function (g) { return (P[g[0]] || []).length; }) || (C.executivo || []).length || (vetos && vetos.lista && vetos.lista.length);
  if (temPres) {
    var s6 = secao("presidente", "Presidente e governo federal", P.intro);
    gruposPres.forEach(function (g) { if ((P[g[0]] || []).length) { s6.appendChild(el("h3", { text: g[1] })); s6.appendChild(itens(P[g[0]])); } });
    if ((C.executivo || []).length) { s6.appendChild(el("h3", { text: "Outros atos do governo" })); s6.appendChild(itens(C.executivo)); }
    if (vetos && vetos.lista && vetos.lista.length) {
      var tvt = el("table", null, [el("thead", null, [el("tr", null, [el("th", { text: "Veto" }), el("th", { text: "Tipo" }), el("th", { text: "Prazo" }), el("th", { text: "Sobre" })])])]), tbt = el("tbody");
      vetos.lista.slice(0, 8).forEach(function (x) {
        tbt.appendChild(el("tr", null, [el("td", { class: "dado", style: "white-space:nowrap", text: x.identificacao || "" }), el("td", { text: x.tipo || "" }), el("td", { class: "dado", text: x.prazo ? dataBR(x.prazo) : "—" }), el("td", { class: "nota", text: (x.ementa || "").length > 160 ? x.ementa.slice(0, 160) + "…" : (x.ementa || "") })]));
      });
      tvt.appendChild(tbt);
      s6.appendChild(el("h3", { text: "Vetos à espera do Congresso" }));
      s6.appendChild(el("div", { class: "tabela" }, [tvt]));
      s6.appendChild(el("p", { class: "nota", text: vetos.total + " vetos presidenciais aguardam votação do Congresso; aqui, os 8 com prazo mais recente. Depois do prazo, o veto passa a trancar a pauta das sessões conjuntas. Fonte: Senado Federal, dados abertos." }));
    }
  }

  /* §7 Justiça */
  if ((C.justica || []).length) { var s6j = secao("justica", "STF e tribunais superiores"); s6j.appendChild(itens(C.justica)); }

  /* Câmaras das capitais: projetos de lei e leis publicadas na semana */
  var CAP = K.capitais;
  if (CAP && CAP.camaras && CAP.camaras.length) {
    var totProj = CAP.camaras.reduce(function (t, c) { return t + c.projetos.length; }, 0);
    var sc = secao("capitais", "Câmaras das capitais", totProj + " projetos de lei apresentados em " + CAP.camaras.filter(function (c) { return c.projetos.length; }).length + " capitais com dados abertos. Indicações, moções e requerimentos aparecem só no total de cada câmara.");
    var bv = el("input", { type: "search", id: "busca-vereador", class: "filtro", placeholder: "Buscar por vereador, cidade ou assunto", "aria-label": "Buscar projetos das câmaras das capitais" });
    var rv = el("div", { class: "resultados", id: "resultado-vereador", "aria-live": "polite" });
    sc.appendChild(el("p", { class: "so-impressao", text: "Na página online, cada capital abre a lista dos projetos com autor e link, e há uma busca por vereador ou assunto." }));
    sc.appendChild(el("div", { class: "busca" }, [bv]));
    sc.appendChild(rv);
    var tabelaProjetos = function (lista, comCidade) {
      var t = el("table", null, [el("thead", null, [el("tr", null, (comCidade ? [el("th", { text: "Cidade" })] : []).concat([el("th", { text: "Data" }), el("th", { text: "Projeto" }), el("th", { text: "Autoria" })]))])]);
      var tb = el("tbody");
      lista.forEach(function (pp) {
        var p = pp.p || pp;
        tb.appendChild(el("tr", null, (comCidade ? [el("td", { text: pp.cidade })] : []).concat([
          el("td", { class: "dado", text: dataBR(p.data, { day: "2-digit", month: "2-digit" }) }),
          el("td", null, [el("a", { href: p.url, target: "_blank", rel: "noopener", text: p.tipo + " nº " + p.numero + "/" + p.ano }), el("div", { class: "nota", text: p.ementa.length > 220 ? p.ementa.slice(0, 220) + "…" : p.ementa })]),
          el("td", { text: (p.autores || []).join(", ") || "—" })
        ])));
      });
      t.appendChild(tb);
      return el("div", { class: "tabela" }, [t]);
    };
    var todos = [];
    CAP.camaras.forEach(function (c) {
      c.projetos.forEach(function (p) { todos.push({ cidade: c.cidade + " (" + c.uf + ")", p: p, busca: normaliza([c.cidade, c.uf, p.ementa, (p.autores || []).join(" ")].join(" ")) }); });
      var outros = Object.keys(c.outros || {}).sort(function (a, b) { return c.outros[b] - c.outros[a]; });
      var nOutros = outros.reduce(function (t, k) { return t + c.outros[k]; }, 0);
      var det = el("details", { class: "capital" });
      det.appendChild(el("summary", null, [el("strong", { text: c.cidade + " (" + c.uf + ")" }), el("span", { class: "nota", text: " · " + c.projetos.length + " projetos de lei · " + c.leis.length + " leis publicadas · " + nOutros + " outras proposições" })]));
      if (c.projetos.length) det.appendChild(tabelaProjetos(c.projetos, false));
      else det.appendChild(el("p", { class: "vazio", text: c.aviso ? "Não foi possível consultar esta câmara: " + c.aviso : "Nenhum projeto de lei registrado no sistema da câmara nesta semana." }));
      if (c.leis.length) {
        det.appendChild(el("h3", { text: "Leis publicadas" }));
        det.appendChild(el("ul", { class: "leis-capital" }, c.leis.map(function (l) { return el("li", null, [el("a", { href: l.url, target: "_blank", rel: "noopener", text: l.titulo }), l.ementa ? el("span", { class: "nota", text: " · " + (l.ementa.length > 180 ? l.ementa.slice(0, 180) + "…" : l.ementa) }) : null]); })));
      }
      if (nOutros) det.appendChild(el("p", { class: "nota", text: "Outras proposições: " + outros.slice(0, 6).map(function (k) { return k + " " + c.outros[k]; }).join(" · ") + (outros.length > 6 ? " · demais tipos " + outros.slice(6).reduce(function (t, k) { return t + c.outros[k]; }, 0) : "") + "." }));
      if (c.aviso && c.projetos.length) det.appendChild(el("p", { class: "nota", text: "Aviso: " + c.aviso }));
      if (c.url) det.appendChild(el("p", { class: "nota" }, ["Fonte: ", el("a", { href: c.url, target: "_blank", rel: "noopener", text: (c.fonte || "sistema") + " da Câmara Municipal de " + c.cidade })]));
      sc.appendChild(det);
    });
    bv.addEventListener("input", function () {
      var q = normaliza(bv.value.trim());
      rv.innerHTML = "";
      if (q.length < 3) return;
      var achados = todos.filter(function (x) { return x.busca.indexOf(q) >= 0; });
      rv.appendChild(achados.length ? tabelaProjetos(achados.slice(0, 40), true) : el("p", { class: "vazio", text: "Nenhum projeto encontrado com esse termo nesta semana." }));
      if (achados.length > 40) rv.appendChild(el("p", { class: "nota", text: "Mostrando 40 de " + achados.length + " projetos. Refine a busca." }));
    });
    if (CAP.sem_cobertura && CAP.sem_cobertura.length) {
      sc.appendChild(el("p", { class: "nota" }, [el("strong", { text: "Sem dados nesta edição: " }), CAP.sem_cobertura.map(function (x) { return x[1] + " (" + x[2] + ")"; }).join("; ") + ". Levantamento das câmaras feito em " + dataBR(CAP.levantamento) + "."]));
    }
  }

  /* §7 Bahia */
  if ((C.bahia || []).length) { var s7 = secao("bahia", "Bahia e Salvador, em resumo"); s7.appendChild(itens(C.bahia)); }

  /* §8 Agenda */
  var s8 = secao("agenda", "Agenda da próxima semana");
  var ag = (C.agenda || []).slice();
  ((K.camara || {}).agenda || []).forEach(function (e) { ag.push({ data: e.inicio, evento: e.descricao, onde: "Plenário da Câmara" + (e.situacao ? " · " + e.situacao.toLowerCase() : "") }); });
  ag.sort(function (a, b) { return String(a.data).localeCompare(String(b.data)); });
  if (ag.length) {
    var ta = el("table", null, [el("thead", null, [el("tr", null, [el("th", { text: "Quando" }), el("th", { text: "O quê" }), el("th", { text: "Onde" })])])]), tba = el("tbody");
    ag.forEach(function (a) { tba.appendChild(el("tr", null, [el("td", { class: "dado", text: dataBR(a.data, a.data && a.data.length > 10 ? { weekday: "short", day: "2-digit", month: "2-digit", hour: "2-digit", minute: "2-digit" } : { weekday: "short", day: "2-digit", month: "2-digit" }) }), el("td", { text: a.evento }), el("td", { text: a.onde || "" })])); });
    ta.appendChild(tba); s8.appendChild(el("div", { class: "tabela" }, [ta]));
  } else s8.appendChild(el("p", { class: "vazio", text: "Nenhum evento encontrado para a próxima semana." }));

  /* §9 Tema da semana */
  if (C.tema_da_semana) {
    var s9 = secao("tema", "Para entender: " + C.tema_da_semana.titulo);
    s9.appendChild(el("div", { class: "tema" }, paragrafos(C.tema_da_semana.texto).concat([fontes(C.tema_da_semana.fontes)])));
  }

  /* Rodapé */
  var rod = document.getElementById("rodape");
  var av = (C.avisos || []).concat(K.avisos || []);
  if (av.length) { rod.appendChild(el("strong", { text: "O que não foi possível consultar" })); rod.appendChild(el("ul", { class: "avisos" }, av.map(function (a) { return el("li", { text: a }); }))); }
  rod.appendChild(el("p", { text: "Critérios: Entrega é um fato concreto do mandato (projeto aprovado, relatoria concluída, presença em votação importante). Ponto de atenção é um fato verificável que merece olhar crítico (falta em votação, gasto acima da média, voto contra a orientação do próprio partido, investigação aberta). Registro é um fato sem juízo." }));
  rod.appendChild(el("p", { text: "Os dados vêm de fontes oficiais consultadas na data de publicação. O boletim é informativo, não toma partido e não substitui a leitura das fontes." }));

  /* Tópicos: botões no início e no fim de cada tópico; o endereço (#id) diz qual tópico está aberto */
  function botoes(atual) {
    var g = el("div", { class: "topicos" });
    secoes.forEach(function (s, i) {
      var a = el("a", { href: "#" + s[0] }, [el("span", { class: "par", text: "§ " + (i + 1) }), el("span", { text: s[1] })]);
      if (s[0] === atual) a.setAttribute("aria-current", "page");
      g.appendChild(a);
    });
    return g;
  }
  var inicio = document.getElementById("inicio");
  document.getElementById("sumario").replaceWith(botoes(null));
  secoes.forEach(function (s) {
    var sec = document.getElementById(s[0]);
    sec.insertBefore(el("a", { class: "voltar", href: "#inicio", text: "← Todos os tópicos" }), sec.firstChild);
    sec.appendChild(el("nav", { class: "topicos-fim", "aria-label": "Outros tópicos" }, [el("span", { class: "rotulo", text: "Outros tópicos" }), botoes(s[0]), el("a", { class: "voltar", href: "#inicio", text: "← Voltar ao início" })]));
  });
  var ALIAS = { "governo-justica": "presidente", "como-votou": "parlamentares" };
  function abrirTopico() {
    var h = location.hash.replace(/^#/, "");
    h = ALIAS[h] || h;
    var existe = secoes.some(function (s) { return s[0] === h; });
    inicio.classList.toggle("inativa", existe);
    secoes.forEach(function (s) { document.getElementById(s[0]).classList.toggle("inativa", s[0] !== h); });
    window.scrollTo(0, 0);
  }
  window.addEventListener("hashchange", abrirTopico);
  abrirTopico();
})();
</script>
