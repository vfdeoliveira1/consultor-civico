<style>
/* Layout: coluna de leitura única, como um boletim oficial; cabeçalho de seção com nº de parágrafo (§), dados em mono. */
:root {
  --papel: #f5f6f3;
  --folha: #ffffff;
  --tinta: #17211f;
  --tinta-2: #4b5855;
  --linha: #d9dedb;
  --acento: #0e6655;
  --acento-suave: #e1efeb;
  --ocre: #9a6412;
  --bom: #1f7a3d;
  --atencao: #a3461c;
  --neutro: #55627a;
  --f-titulo: "Archivo", "Arial Narrow", "Helvetica Neue", Arial, sans-serif;
  --f-texto: "Source Serif 4", Georgia, "Times New Roman", serif;
  --f-dado: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
  --raio: 6px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --papel: #0f1514; --folha: #161e1c; --tinta: #e4ebe8; --tinta-2: #9fb0ab; --linha: #2a3532;
    --acento: #5cc7ad; --acento-suave: #1b2f2a; --ocre: #e0a54a; --bom: #6fcf8e; --atencao: #f08a5d; --neutro: #9aa8c4;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --papel: #0f1514; --folha: #161e1c; --tinta: #e4ebe8; --tinta-2: #9fb0ab; --linha: #2a3532;
  --acento: #5cc7ad; --acento-suave: #1b2f2a; --ocre: #e0a54a; --bom: #6fcf8e; --atencao: #f08a5d; --neutro: #9aa8c4;
  color-scheme: dark;
}
* { box-sizing: border-box; }
body {
  background: var(--papel); color: var(--tinta);
  font-family: var(--f-texto); font-size: 1.05rem; line-height: 1.6;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 0 48px;
}
.coluna { max-width: 46rem; width: 100%; margin: 0 auto; display: flex; flex-direction: column; gap: 3rem; }
/* Itens de flex encolhem; sem isso uma tabela larga alarga a página inteira. */
.coluna > *, section > * { min-width: 0; }
a { color: var(--acento); text-underline-offset: 2px; }
a:focus-visible, button:focus-visible { outline: 2px solid var(--acento); outline-offset: 2px; }
h1, h2, h3 { font-family: var(--f-titulo); text-wrap: balance; margin: 0; line-height: 1.15; }
p { margin: 0; }
.dado, .num { font-family: var(--f-dado); font-variant-numeric: tabular-nums; }
.rotulo { font-family: var(--f-titulo); font-size: .72rem; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; color: var(--tinta-2); }

/* Cabeçalho */
.cabecalho { padding-block: 2.5rem 1.5rem; border-bottom: 3px double var(--tinta); display: flex; flex-direction: column; gap: .6rem; }
.cabecalho h1 { font-size: clamp(2.2rem, 7vw, 3.4rem); font-weight: 800; font-stretch: 80%; letter-spacing: -.01em; }
.cabecalho .linha-edicao { display: flex; flex-wrap: wrap; gap: .25rem 1.25rem; color: var(--tinta-2); font-size: .95rem; }
.sumario { display: flex; flex-wrap: wrap; gap: .4rem .5rem; padding-top: .5rem; }
.sumario a { font-family: var(--f-titulo); font-size: .82rem; font-weight: 600; text-decoration: none; color: var(--tinta); border: 1px solid var(--linha); border-radius: 999px; padding: .2rem .7rem; background: var(--folha); }
.sumario a:hover { border-color: var(--acento); color: var(--acento); }

/* Seções */
section { display: flex; flex-direction: column; gap: 1.25rem; scroll-margin-top: 1rem; }
.secao-topo { display: flex; align-items: baseline; gap: .75rem; border-bottom: 1px solid var(--linha); padding-bottom: .5rem; }
.secao-topo .par { font-family: var(--f-dado); color: var(--acento); font-size: .95rem; }
.secao-topo h2 { font-size: 1.55rem; font-weight: 700; font-stretch: 88%; }
.intro { color: var(--tinta-2); }
h3 { font-size: 1.12rem; font-weight: 700; font-stretch: 92%; }

/* Destaques */
.destaques { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: .9rem; counter-reset: d; }
.destaques li { display: grid; grid-template-columns: 2rem 1fr; gap: .5rem; }
.destaques li::before { counter-increment: d; content: counter(d); font-family: var(--f-titulo); font-weight: 800; font-size: 1.4rem; color: var(--acento); line-height: 1.2; }
.destaques li > div { min-width: 0; }

/* Indicadores */
.indicadores { display: grid; grid-template-columns: repeat(auto-fill, minmax(13.5rem, 1fr)); gap: .75rem; }
.ind { background: var(--folha); border: 1px solid var(--linha); border-radius: var(--raio); padding: .8rem .9rem; display: flex; flex-direction: column; gap: .2rem; min-width: 0; }
.ind .valor { font-family: var(--f-dado); font-size: 1.5rem; font-weight: 500; font-variant-numeric: tabular-nums; }
.ind .valor small { font-size: .8rem; color: var(--tinta-2); }
.ind .var { font-family: var(--f-dado); font-size: .78rem; color: var(--tinta-2); }
.ind .ref { font-size: .78rem; color: var(--tinta-2); }
.ind svg { width: 100%; height: 34px; display: block; }

/* Gráficos */
.grafico { background: var(--folha); border: 1px solid var(--linha); border-radius: var(--raio); padding: 1rem; display: flex; flex-direction: column; gap: .5rem; min-width: 0; }
.grafico svg { width: 100%; height: auto; display: block; overflow: visible; }
.grafico .legenda { display: flex; flex-wrap: wrap; gap: .3rem 1rem; font-size: .85rem; color: var(--tinta-2); }
.grafico .legenda span::before { content: ""; display: inline-block; width: .9rem; height: 3px; vertical-align: middle; margin-right: .35rem; background: var(--cor); border-radius: 2px; }
.nota { font-size: .82rem; color: var(--tinta-2); }

/* Tabelas */
.tabela { overflow-x: auto; border: 1px solid var(--linha); border-radius: var(--raio); background: var(--folha); }
table { border-collapse: collapse; width: 100%; font-size: .92rem; }
th, td { text-align: left; padding: .55rem .7rem; border-bottom: 1px solid var(--linha); vertical-align: top; }
th { font-family: var(--f-titulo); font-size: .74rem; letter-spacing: .06em; text-transform: uppercase; color: var(--tinta-2); font-weight: 600; white-space: nowrap; }
tr:last-child td { border-bottom: 0; }
td.n, th.n { text-align: right; font-family: var(--f-dado); font-variant-numeric: tabular-nums; white-space: nowrap; }

/* Selos */
.selo { display: inline-block; font-family: var(--f-titulo); font-size: .7rem; font-weight: 700; letter-spacing: .05em; text-transform: uppercase; padding: .1rem .45rem; border-radius: 3px; border: 1px solid currentColor; white-space: nowrap; }
.selo.bom { color: var(--bom); } .selo.atencao { color: var(--atencao); } .selo.neutro { color: var(--neutro); } .selo.ocre { color: var(--ocre); }

/* Itens de notícia e lei */
.itens { display: flex; flex-direction: column; gap: 1.1rem; }
.item { display: flex; flex-direction: column; gap: .35rem; padding-left: .9rem; border-left: 2px solid var(--linha); }
.item .meta { display: flex; flex-wrap: wrap; gap: .4rem .6rem; align-items: center; font-size: .85rem; color: var(--tinta-2); }
.fontes { font-size: .82rem; color: var(--tinta-2); }
.fontes a { margin-right: .6rem; }

/* Deputados */
.deputado { background: var(--folha); border: 1px solid var(--linha); border-radius: var(--raio); padding: 1.1rem; display: flex; flex-direction: column; gap: .9rem; }
.deputado .topo { display: flex; flex-wrap: wrap; justify-content: space-between; gap: .4rem 1rem; align-items: baseline; }
.deputado .cargo { font-size: .9rem; color: var(--tinta-2); }
.fatos { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: .6rem; }
.fatos li { display: grid; grid-template-columns: 7.5rem 1fr; gap: .6rem; align-items: start; }
.fatos li > div { min-width: 0; }
.lados { display: grid; grid-template-columns: repeat(auto-fit, minmax(14rem, 1fr)); gap: .75rem; }
.lados > div { background: var(--acento-suave); border-radius: var(--raio); padding: .7rem .8rem; font-size: .95rem; min-width: 0; }
.barras { display: flex; flex-direction: column; gap: .35rem; }
.barra { display: grid; grid-template-columns: minmax(0, 1fr) 6.5rem; gap: .5rem; font-size: .85rem; align-items: center; }
.barra .trilho { grid-column: 1 / -1; height: 6px; background: var(--linha); border-radius: 3px; overflow: hidden; }
.barra .trilho i { display: block; height: 100%; background: var(--acento); }

/* Tema da semana */
.tema { background: var(--acento-suave); border-radius: var(--raio); padding: 1.25rem; display: flex; flex-direction: column; gap: .75rem; }
.tema p { max-width: 65ch; }

/* Avisos e fontes podem trazer URLs longas, sem espaço para quebrar. */
.avisos, .fontes, .item, .fatos { overflow-wrap: anywhere; }
.avisos { font-size: .9rem; color: var(--tinta-2); display: flex; flex-direction: column; gap: .3rem; padding-left: 1.1rem; margin: 0; }
.rodape { font-size: .85rem; color: var(--tinta-2); border-top: 1px solid var(--linha); padding-top: 1rem; display: flex; flex-direction: column; gap: .4rem; }
.vazio { color: var(--tinta-2); font-style: italic; }

@media (max-width: 520px) {
  .fatos li { grid-template-columns: 1fr; gap: .2rem; }
  body { font-size: 1rem; }
}
@media (prefers-reduced-motion: no-preference) {
  .sumario a { transition: border-color .15s, color .15s; }
}
</style>

<div class="coluna" id="app">

<script id="dados" type="application/json">{{DADOS}}</script>
<script>
(function () {
  "use strict";
  var D = JSON.parse(document.getElementById("dados").textContent);
  var C = D.conteudo || {}, K = D.coletados || {};
  var E = (K.economia || {}), S = E.series || {};

  /* ---------- utilitários ---------- */
  function el(tag, attrs, filhos) {

    if (attrs) for (var k in attrs) {

  var nf = function (v, casas) { return v == null || isNaN(v) ? "—" : Number(v).toLocaleString("pt-BR", { minimumFractionDigits: casas, maximumFractionDigits: casas }); };
  var brl = function (v) { return v == null ? "—" : Number(v).toLocaleString("pt-BR", { style: "currency", currency: "BRL", maximumFractionDigits: 0 }); };
  function dataBR(iso, opts) {

  }
  function mesBR(iso) { return dataBR(iso, { month: "short", year: "2-digit" }).replace(". de ", "/").replace(" de ", "/"); }

      return f.url ? el("a", { href: f.url, target: "_blank", rel: "noopener" }, [f.nome || f.url]) : el("span", { text: f.nome + " " });
    })));
  }
  function paragrafos(texto) {

  }
  var SELOS = { entrega: ["bom", "Entrega"], atencao: ["atencao", "Ponto de atenção"], registro: ["neutro", "Registro"], aprovada: ["bom", "Aprovada"], sancionada: ["bom", "Sancionada"], promulgada: ["bom", "Promulgada"], rejeitada: ["atencao", "Rejeitada"], vetada: ["atencao", "Vetada"], "veto parcial": ["ocre", "Veto parcial"], "em tramitação": ["neutro", "Em tramitação"], editada: ["ocre", "Editada"], "perde validade": ["atencao", "Perde validade"] };
  function selo(tipo, textoLivre) {
    var s = SELOS[(tipo || "").toLowerCase()] || ["neutro", textoLivre || tipo || ""];
    return el("span", { class: "selo " + s[0], text: textoLivre || s[1] });
  }

  var secoes = [];
  function secao(id, titulo, intro) {
    var n = secoes.length + 1;
    var s = el("section", { id: id }, [
      el("div", { class: "secao-topo" }, [el("span", { class: "par", text: "§ " + n }), el("h2", { text: titulo })])
    ]);
    if (intro) s.appendChild(el("p", { class: "intro", text: intro }));
    secoes.push([id, titulo]);
    document.getElementById("conteudo").appendChild(s);

  }

  /* ---------- gráficos SVG ---------- */
  function ultimo(serie) { return serie && serie.pontos && serie.pontos.length ? serie.pontos[serie.pontos.length - 1] : null; }
  function valorEm(serie, diasAtras) {
    if (!serie || !serie.pontos.length) return null;
    var fim = new Date(ultimo(serie)[0]); fim.setDate(fim.getDate() - diasAtras);
    var alvo = fim.toISOString().slice(0, 10), achado = null;
    serie.pontos.forEach(function (p) { if (p[0] <= alvo) achado = p; });
    return achado;
  }
  function sparkline(pontos, corVar) {
    var w = 200, h = 34, s = svgEl("svg", { viewBox: "0 0 " + w + " " + h, preserveAspectRatio: "none", "aria-hidden": "true" });
    if (!pontos || pontos.length < 2) return s;
    var ys = pontos.map(function (p) { return p[1]; }), min = Math.min.apply(null, ys), max = Math.max.apply(null, ys), r = (max - min) || 1;
    var pts = pontos.map(function (p, i) { return [i / (pontos.length - 1) * (w - 4) + 2, h - 3 - (p[1] - min) / r * (h - 6)]; });
    var d = pts.map(function (p, i) { return (i ? "L" : "M") + p[0].toFixed(1) + " " + p[1].toFixed(1); }).join(" ");
    s.appendChild(svgEl("path", { d: d + " L" + pts[pts.length - 1][0] + " " + h + " L" + pts[0][0] + " " + h + " Z", fill: cor(corVar), "fill-opacity": ".12", stroke: "none" }));
    s.appendChild(svgEl("path", { d: d, fill: "none", stroke: cor(corVar), "stroke-width": "1.6", "vector-effect": "non-scaling-stroke" }));
    var u = pts[pts.length - 1];
    s.appendChild(svgEl("circle", { cx: u[0], cy: u[1], r: 2.5, fill: cor(corVar) }));
    return s;
  }
  // Gráfico de linhas com eixo de tempo; series = [{nome, pontos, corVar}]
  function grafico(titulo, series, opts) {
    opts = opts || {};
    var caixa = el("figure", { class: "grafico", style: "margin:0" });
    caixa.appendChild(el("h3", { text: titulo }));
    series = series.filter(function (s) { return s.pontos && s.pontos.length > 1; });
    if (!series.length) { caixa.appendChild(el("p", { class: "vazio", text: "Dados indisponíveis nesta edição." })); return caixa; }
    var W = 640, H = 240, m = { t: 12, r: 16, b: 28, l: 44 };
    var todos = [].concat.apply([], series.map(function (s) { return s.pontos; }));
    var t0 = Math.min.apply(null, todos.map(function (p) { return +new Date(p[0]); })), t1 = Math.max.apply(null, todos.map(function (p) { return +new Date(p[0]); }));
    var ys = todos.map(function (p) { return p[1]; }), y0 = Math.min.apply(null, ys), y1 = Math.max.apply(null, ys);
    if (opts.zero) y0 = Math.min(0, y0);
    var pad = (y1 - y0) * .08 || 1; y0 -= pad; y1 += pad;
    var passo = Math.pow(10, Math.floor(Math.log10((y1 - y0) / 4))); [1, 2, 2.5, 5, 10].some(function (k) { if ((y1 - y0) / (passo * k) <= 5) { passo *= k; return true; } });
    var X = function (t) { return m.l + (t - t0) / ((t1 - t0) || 1) * (W - m.l - m.r); };
    var Y = function (v) { return H - m.b - (v - y0) / (y1 - y0) * (H - m.t - m.b); };
    var s = svgEl("svg", { viewBox: "0 0 " + W + " " + H, role: "img", "aria-label": titulo });
    var cLinha = cor("--linha"), cTexto = cor("--tinta-2");
    for (var v = Math.ceil(y0 / passo) * passo; v <= y1; v += passo) {
      s.appendChild(svgEl("line", { x1: m.l, x2: W - m.r, y1: Y(v), y2: Y(v), stroke: cLinha, "stroke-width": 1 }));
      var tx = svgEl("text", { x: m.l - 6, y: Y(v) + 4, "text-anchor": "end", "font-size": 11, fill: cTexto, "font-family": "IBM Plex Mono, monospace" });
      tx.textContent = nf(v, passo < 1 ? (passo < .1 ? 2 : 1) : 0); s.appendChild(tx);
    }
    var meses = (t1 - t0) / 2.6e9, nTicks = meses > 10 ? 6 : 4;
    for (var i = 0; i <= nTicks; i++) {

    }
    series.forEach(function (se) {
      var d = se.pontos.map(function (p, i) { return (i ? "L" : "M") + X(+new Date(p[0])).toFixed(1) + " " + Y(p[1]).toFixed(1); }).join(" ");
      s.appendChild(svgEl("path", { d: d, fill: "none", stroke: cor(se.corVar), "stroke-width": 2.2, "stroke-linejoin": "round" }));
      var u = se.pontos[se.pontos.length - 1], ux = X(+new Date(u[0])), uy = Y(u[1]);
      s.appendChild(svgEl("circle", { cx: ux, cy: uy, r: 3.5, fill: cor(se.corVar) }));
      var rot = svgEl("text", { x: ux - 6, y: uy - 8, "text-anchor": "end", "font-size": 12, "font-weight": 500, fill: cor(se.corVar), "font-family": "IBM Plex Mono, monospace" });

  }

  /* ---------- cabeçalho ---------- */
  var sem = K.semana || C.semana || {};
  document.getElementById("titulo").textContent = "Semana de " + dataBR(sem.inicio, { day: "numeric", month: "long" }) + " a " + dataBR(sem.fim, { day: "numeric", month: "long", year: "numeric" });
  var ed = document.getElementById("edicao");
  ed.appendChild(el("span", { class: "dado", text: "Edição " + (D.edicao || "") }));
  ed.appendChild(el("span", { text: "Publicado em " + dataBR(D.gerado_em, { day: "2-digit", month: "2-digit", year: "numeric", hour: "2-digit", minute: "2-digit" }) }));

  });

  /* §2 Economia */
  var s2 = secao("economia", "Economia", C.economia && C.economia.intro);
  var ind = el("div", { class: "indicadores" });
  var defs = [
    ["selic_meta", "Meta Selic", 2, "% a.a.", 30, "--acento"],
    ["ipca_12m", "IPCA em 12 meses", 2, "%", 31, "--ocre"],
    ["dolar", "Dólar comercial", 4, "R$", 7, "--neutro"],
    ["desocupacao", "Desemprego", 1, "%", 31, "--atencao"],
    ["juros_pf", "Juros ao consumidor", 1, "% a.a.", 31, "--atencao"],
    ["dbgg", "Dívida bruta", 1, "% do PIB", 31, "--neutro"]

  defs.forEach(function (d) {
